# Build, validate, and deploy the Jekyll site to GitHub Pages.
# Cloudflare proxies penderdesigns.com in front of the GitHub Pages origin.
name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - master
      - chore/update-ci   # remove once CI changes are merged
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. Don't cancel an in-progress run —
# we want production deploys to finish even if a new commit lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f  # v1.310.0
        with:
          bundler-cache: true       # runs bundle install + caches gems
          cache-version: 0          # bump to invalidate gem cache

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --strict-front-matter
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # avoids GitHub API rate limits

      # Non-blocking initially: there are ~54 pre-existing issues at the time of
      # adding this check (mostly pandoc-style cross-refs in heat_exchanger.md
      # and theme-rendered empty <a> tags). Surface them in PR/Actions output
      # without failing the build. Remove `continue-on-error` once the backlog
      # is fixed to make this strict.
      - name: Validate HTML and internal links
        continue-on-error: true
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-empty-alt \
            --no-enforce-https \
            --ignore-files "/.*\/docs\/.*/,/.*\/legacy\/.*/,/.*CHANGELOG.*/" \
            --checks Links,Images,Scripts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
